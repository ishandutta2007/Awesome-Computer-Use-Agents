<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0d19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#060814"/></linearGradient><radialGradient id="glowPurple" cx="20%" cy="30%" r="60%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".35"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient><radialGradient id="glowCyan" cx="80%" cy="70%" r="60%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".35"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/></radialGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#60a5fa"/><stop offset="50%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#34d399"/></linearGradient><linearGradient id="lineGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#3b82f6" stop-opacity="0"/><stop offset="50%" stop-color="#8b5cf6" stop-opacity=".8"/><stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".07"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="shadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".6" stdDeviation="12"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.08)}}@keyframes scanline{0%{transform:translateY(-100%)}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0);opacity:.4}50%{transform:translateY(-15px) translateX(10px);opacity:.9}}@keyframes dashFlow{0%{stroke-dashoffset:100}}.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;font-weight:800;font-size:48px;fill:#fff;letter-spacing:-.5px}.gradient-text{fill:url(#textGrad)}.subtitle,.tag{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;font-weight:400;font-size:20px;fill:#9ca3af}.tag{font-weight:600;font-size:13px;fill:#38bdf8;letter-spacing:1.5px;text-transform:uppercase}.pulse-1{animation:pulseGlow 8s ease-in-out infinite;transform-origin:200px 100px}.pulse-2{animation:pulseGlow 10s ease-in-out infinite 2s;transform-origin:1000px 260px}.particle-1{animation:floatParticle 6s ease-in-out infinite}.particle-2{animation:floatParticle 8s ease-in-out infinite 1s}.particle-3{animation:floatParticle 7s ease-in-out infinite 3s}.flowing-path{stroke-dasharray:12 8;animation:dashFlow 20s linear infinite}</style><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><circle cx="200" cy="100" r="280" fill="url(#glowPurple)" class="pulse-1"/><circle cx="1000" cy="260" r="300" fill="url(#glowCyan)" class="pulse-2"/><g opacity=".08"><path stroke="#fff" stroke-width="1" d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200"/><path stroke="#fff" stroke-width="1" d="M150 0 V360 M300 0 V360 M450 0 V360 M600 0 V360 M750 0 V360 M900 0 V360 M1050 0 V360"/></g><g opacity=".25"><path fill="none" stroke="url(#lineGrad)" stroke-width="2" d="M -50,280 Q 300,340 600,220 T 1250,140" class="flowing-path"/><path fill="none" stroke="url(#lineGrad)" stroke-width="1.5" d="M -50,90 Q 400,20 800,160 T 1250,80" class="flowing-path"/></g><circle cx="180" cy="260" r="4" fill="#60a5fa" class="particle-1"/><circle cx="950" cy="80" r="5" fill="#a78bfa" class="particle-2"/><circle cx="1080" cy="220" r="3.5" fill="#34d399" class="particle-3"/><circle cx="120" cy="90" r="3" fill="#38bdf8" class="particle-1"/><rect width="1080" height="270" x="60" y="45" fill="url(#cardGrad)" stroke="#fff" stroke-opacity=".12" stroke-width="1" filter="url(#shadow)" rx="16"/><g transform="translate(100, 85)"><rect width="280" height="28" x="0" y="0" fill="#0369a1" fill-opacity=".3" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1" rx="14"/><text x="14" y="18" class="tag">🤖 AI Computer-Use &amp; GUI Agents</text><text x="0" y="78" class="title">Awesome <tspan class="gradient-text">Computer-Use</tspan> Agents</text><text x="0" y="122" class="subtitle">Curated List of SaaS Platforms &amp; Open-Source Frameworks Operating Computers Like Humans</text><g transform="translate(0, 150)"><rect width="170" height="32" x="0" y="0" fill="#1e293b" stroke="#475569" stroke-width="1" rx="8"/><circle cx="16" cy="16" r="5" fill="#34d399"/><text x="28" y="21" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Browser Control</text><rect width="170" height="32" x="182" y="0" fill="#1e293b" stroke="#475569" stroke-width="1" rx="8"/><circle cx="198" cy="16" r="5" fill="#60a5fa"/><text x="210" y="21" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Desktop Perception</text><rect width="160" height="32" x="364" y="0" fill="#1e293b" stroke="#475569" stroke-width="1" rx="8"/><circle cx="380" cy="16" r="5" fill="#a78bfa"/><text x="392" y="21" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">GUI &amp; VLM Models</text><rect width="180" height="32" x="536" y="0" fill="#1e293b" stroke="#475569" stroke-width="1" rx="8"/><circle cx="552" cy="16" r="5" fill="#f43f5e"/><text x="564" y="21" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Autonomous Workflows</text></g></g></svg>